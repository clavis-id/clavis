# OpenID Foundation conformance suite against Clavis (ADR 0017). Run it through
# run.sh, which builds Clavis, provides the variables below and cleans up.
#
# Every image is pinned by digest. The suite images and the runner scripts in
# run.sh must come from the same suite release.
name: clavis-conformance

services:
  mongodb:
    # The version the suite's own docker-compose.yml uses at the pinned
    # release. Dependabot ignores this image: move it only with the suite.
    image: mongo:6.0.13@sha256:b415b12f638e2685d06c58ab7fb5943577c50fadec6d9340ef67d21aeac72070
    tmpfs:
      - /data/db

  server:
    image: registry.gitlab.com/openid/conformance-suite:release-v5.3.3@sha256:377ab51f011d821c4b6f7729053e85adf062d691e51a3615f40507fd900a2436
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      # The suite's own web login needs these settings even in dev mode; the
      # placeholder values come from the suite's docker-compose-prebuilt.yml.
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    depends_on:
      - mongodb

  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:release-v5.3.3@sha256:d80183af68cb51c72c86b498780d94d6192cbc6adcc70a7d28ac6a01eff0d0db
    ports:
      # Published on the loopback interface only, to browse results locally at
      # https://localhost.emobix.co.uk:8443 (the name resolves to 127.0.0.1).
      - "127.0.0.1:8443:8443"
    networks:
      default:
        aliases:
          # The suite's public name, which the suite itself and its test
          # browser must reach inside the network.
          - localhost.emobix.co.uk
    depends_on:
      - server

  clavis:
    image: gcr.io/distroless/static-debian13:nonroot@sha256:e2e927ec666bae08560abb3c55d0659eceabb657f56b6782ab500a9fc7f555e3
    command: ["/clavis", "serve"]
    volumes:
      # A Linux build of the current commit, written by run.sh.
      - ./.cache/clavis:/clavis:ro
    environment:
      CLAVIS_ISSUER: https://clavis.test
      CLAVIS_SERVER_ADDRESS: ":8080"
      CLAVIS_DATABASE_DSN: /tmp/clavis.db
      # Generated by run.sh for every run; Clavis refuses to start without it.
      CLAVIS_KEYS_ENCRYPTION_KEY: ${CLAVIS_KEYS_ENCRYPTION_KEY:-}

  # Terminates TLS for Clavis with a certificate from Caddy's internal CA. The
  # suite reaches the issuer https://clavis.test through this alias.
  clavis-tls:
    image: caddy:2.11@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - clavis.test
    depends_on:
      - clavis

  # Runs the suite's test plans through its API. Started on demand by run.sh.
  runner:
    image: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    profiles: [runner]
    working_dir: /conformance
    entrypoint: ["/conformance/runner.sh"]
    volumes:
      - ./:/conformance
    environment:
      CONFORMANCE_SERVER: https://localhost.emobix.co.uk:8443/
      CONFORMANCE_SERVER_MTLS: https://localhost.emobix.co.uk:8444/
      # Local suite without authentication.
      CONFORMANCE_DEV_MODE: "1"
      CLAVIS_READY_URL: https://clavis.test/readyz
    depends_on:
      - nginx
      - clavis-tls
