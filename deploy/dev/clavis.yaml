# Local development configuration. Run with `make run`.
issuer: http://localhost:8080

server:
  address: 127.0.0.1:8080
  # Reverse proxies in front of Clavis, as networks or addresses (ADR 0029).
  # Only a request from one of them is from the client that X-Forwarded-For
  # names; without them the header is ignored.
  # trusted_proxies: [10.0.0.0/8]

database:
  driver: sqlite
  dsn: clavis.db

keys:
  # Development only. This key is public: never use it outside a local
  # machine. Generate real keys with `clavis keys new-encryption-key`.
  encryption_key: 4/5XH1+uUgl+6LUm5X36DZuhOwYK5J0Dky6EpUnU9/0= # gitleaks:allow

# Password hashing (ADR 0015). The values shown are the defaults.
# passwords:
#   min_length: 8
#   argon2id:
#     memory_kib: 19456
#     iterations: 2
#     parallelism: 1
#   pbkdf2_iterations: 600000    # used instead of argon2id in FIPS mode
#   max_concurrent_hashes: 0     # 0 means one per CPU
#   fips_migrate_argon2id: true

# Email delivery (ADR 0024). Disabled unless a driver is set; signup (ADR
# 0026) needs it. For local testing, a server such as Mailpit on localhost
# needs no TLS:
# email:
#   driver: smtp               # or console, which only writes messages to the log
#   from: "Clavis <no-reply@localhost>"
#   smtp:
#     host: localhost
#     port: 1025
#     tls: none                # starttls (default) or implicit elsewhere
#     username: ""             # with a password, or CLAVIS_EMAIL_SMTP_PASSWORD
#     timeout: 30s

# Audit log (ADR 0029). The value shown is the default; 0 keeps events forever.
# audit:
#   retention: 2160h

log:
  level: debug
  format: text
