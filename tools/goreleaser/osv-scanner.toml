# Vulnerabilities reported for this tool module that cannot affect Clavis. OSV-Scanner and the
# OpenSSF Scorecard Vulnerabilities check read this file. Review every entry before its
# ignoreUntil date and remove it as soon as a fixed version exists.

[[IgnoredVulns]]
id = "GO-2026-6905"
ignoreUntil = 2027-02-23
reason = "github.com/blakesmith/ar has no fixed version. GoReleaser links it only through its nfpm pipe, which builds Debian packages, and .goreleaser.yaml defines no nfpms, so the code never runs. The vulnerable Reader.Read reads archives, nfpm only writes them, and govulncheck finds no call to it."
