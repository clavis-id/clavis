version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/tools/*"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        patterns: ["*"]

  # Images and runner dependencies of the conformance suite harness.
  - package-ecosystem: docker-compose
    directory: "/conformance"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    groups:
      conformance-images:
        patterns: ["*"]
    ignore:
      # MongoDB moves with the suite release pinned in compose.yaml, whose own
      # compose file uses 6.0.13 at release-v5.3.3. A newer version may not
      # work with the suite or the runner: MongoDB 8.3 refuses to start on
      # Linux 6.19 and newer kernels.
      - dependency-name: mongo
      # The suite images move with the release pinned in run.sh (runner scripts,
      # plans and expected results). Dependabot also cannot read
      # registry.gitlab.com without credentials, which failed every run.
      - dependency-name: openid/conformance-suite
      - dependency-name: openid/conformance-suite/nginx

  - package-ecosystem: pip
    directory: "/conformance"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    groups:
      conformance-runner:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
