version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/tools/*"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
