version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/tools/*"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        patterns: ["*"]

  # Images and runner dependencies of the conformance suite harness.
  - package-ecosystem: docker-compose
    directory: "/conformance"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    groups:
      conformance-images:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/conformance"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    groups:
      conformance-runner:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
