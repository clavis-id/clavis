name: Conformance

# Runs the OpenID Foundation conformance suite against Clavis (ADR 0017). It is
# slow and needs Docker, so it runs on pull requests that change protocol code,
# nightly on develop, and on demand, instead of with every change.
on:
  pull_request:
    branches: [develop, master]
    paths:
      # Root package files: the public API and the protocol handlers.
      - "*.go"
      - cmd/**
      - internal/app/**
      - internal/authn/**
      - internal/keys/**
      - internal/oauth/**
      - internal/oidc/**
      - internal/ui/**
      - store/**
      - conformance/**
      - .github/workflows/conformance.yml
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: OpenID conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs use the default branch's workflow; test develop.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: Run the conformance plans
        run: make conformance
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: conformance/results/
          retention-days: 14
          if-no-files-found: ignore
