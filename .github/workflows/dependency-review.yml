name: Dependency review

on:
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  review:
    name: Review new dependencies
    # Dependency review on private repositories requires GitHub Advanced
    # Security. This job starts running automatically once the repository is
    # public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # The LicenseRef entry is the additional patent grant (PATENTS file)
          # that ships with Go's own modules, such as golang.org/x/sys, which
          # GitHub reports as "BSD-3-Clause AND LicenseRef-...".
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC, MIT,
            MPL-2.0, Unlicense, LicenseRef-scancode-google-patent-license-golang
