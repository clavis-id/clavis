name: CodeQL

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go
    # Code scanning on private repositories requires GitHub Advanced Security.
    # This job starts running automatically once the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: go.sum
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:go
          output: sarif-results
          upload: failure-only
      # templ generates "ctx = ..." assignments that some components never
      # read, and its files are rewritten on every make generate, so the
      # quality rule about useless assignments cannot be fixed in them. Only
      # that rule is removed, only in generated *_templ.go files; every other
      # rule, including the security queries, still applies there.
      - uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            -**/*_templ.go:go/useless-assignment-to-local
          input: sarif-results/go.sarif
          output: sarif-results/go.sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: sarif-results/go.sarif
          category: /language:go
